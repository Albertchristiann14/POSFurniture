services:
  postgres:
    image: postgres:16-alpine
    container_name: krevia_postgres
    restart: always
    environment:
      POSTGRES_USER: krevia_user
      POSTGRES_PASSWORD: krevia_password
      POSTGRES_DB: krevia_pos
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U krevia_user -d krevia_pos"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: krevia_redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:latest
    container_name: krevia_minio
    restart: always
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: krevia_app
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://krevia_user:krevia_password@postgres:5432/krevia_pos?schema=public
      - REDIS_URL=redis://redis:6379
      - DATA_ENCRYPTION_KEY=0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      - BLIND_INDEX_SALT=krevia_furniture_blind_index_salt_super_secret_value_2026
      - JWT_SECRET=krevia_jwt_secret_staff_pos_furniture_change_in_production
      - S3_ENDPOINT=http://minio:9000
      - S3_BUCKET=krevia-documents
      - S3_ACCESS_KEY=minioadmin
      - S3_SECRET_KEY=minioadmin

volumes:
  postgres_data:
  redis_data:
  minio_data:
